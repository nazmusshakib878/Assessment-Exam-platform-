services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: assessment
      MYSQL_USER: assessment
      MYSQL_PASSWORD: assessment
      MYSQL_ROOT_PASSWORD: root
  backend:
    build: ./backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: assessment
      DB_USERNAME: assessment
      DB_PASSWORD: assessment
    ports: ["8000:8000"]
    depends_on: [mysql]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
